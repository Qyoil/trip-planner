<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 여행 플래너</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Pretendard Font for Korean Readability -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Pretendard Variable"', 'Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        body {
            word-break: keep-all; /* 한글 단어 쪼개짐 방지 */
            letter-spacing: -0.015em;
        }
    </style>

<body class="bg-slate-100/80 min-h-full font-sans text-slate-900 antialiased flex flex-col">

    <!-- Header -->
    <header class="bg-white/95 backdrop-blur-md sticky top-0 z-30 border-b border-slate-200/80 shadow-xs">
        <div class="max-w-lg mx-auto px-5 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white w-10 h-10 rounded-2xl flex items-center justify-center shadow-sm">
                    <i class="fa-solid fa-plane-departure text-base"></i>
                </div>
                <div>
                    <span class="font-extrabold text-lg text-slate-900 tracking-tight block leading-none">TripAI Planner</span>
                    <span class="text-[11px] text-indigo-600 font-bold tracking-wide mt-1 block">Gemini AI 여행 가이드</span>
                </div>
            </div>
            <div id="api-status-badge" class="flex items-center space-x-1.5 text-xs text-slate-700 bg-slate-100 px-3 py-1.5 rounded-full font-semibold border border-slate-200">
                <span id="api-status-dot" class="w-2 h-2 rounded-full bg-amber-500"></span>
                <span id="api-status-text">API 연결 확인중</span>
            </div>
        </div>
    </header>

    <!-- Main Container (Mobile & Tablet comfortable width: max-w-lg) -->
    <main class="flex-1 max-w-lg w-full mx-auto px-4 sm:px-5 py-7 space-y-6">

        <!-- Input Form Card -->
        <section class="bg-white rounded-3xl p-6 sm:p-7 shadow-sm border border-slate-200/80 transition-all duration-300">
            <div class="mb-6">
                <h1 class="text-2xl font-extrabold text-slate-900 mb-2 tracking-tight">어디로 떠나시나요? ✈️</h1>
                <p class="text-sm text-slate-600 leading-relaxed">여행지, 기간, 동행자, 관심사를 입력하시면 실제 존재하는 맛집과 명소 중심으로 최적의 동선을 짜드립니다.</p>
            </div>

            <form id="plan-form" class="space-y-5" onsubmit="handleGenerate(event)">
                <!-- Destination -->
                <div>
                    <label class="block text-sm font-bold text-slate-800 mb-2" for="destination">
                        <i class="fa-solid fa-location-dot text-indigo-600 mr-1.5"></i>어디로 가시나요?
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-slate-400">
                            <i class="fa-solid fa-search text-sm"></i>
                        </span>
                        <input type="text" id="destination" required placeholder="예: 일본 도쿄, 제주도, 파리" 
                            class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-300 rounded-2xl text-base text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:border-transparent focus:bg-white transition-all">
                    </div>
                </div>

                <!-- Duration & Companions (Grid) -->
                <div class="grid grid-cols-2 gap-3.5">
                    <div>
                        <label class="block text-sm font-bold text-slate-800 mb-2" for="duration">
                            <i class="fa-solid fa-calendar-days text-indigo-600 mr-1.5"></i>여행 기간
                        </label>
                        <select id="duration" 
                            class="w-full px-3.5 py-3.5 bg-slate-50 border border-slate-300 rounded-2xl text-base text-slate-900 font-medium focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:border-transparent focus:bg-white transition-all">
                            <option value="1박 2일">1박 2일</option>
                            <option value="2박 3일" selected>2박 3일</option>
                            <option value="3박 4일">3박 4일</option>
                            <option value="4박 5일">4박 5일</option>
                            <option value="일주일">일주일 이상</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-slate-800 mb-2" for="companion">
                            <i class="fa-solid fa-user-group text-indigo-600 mr-1.5"></i>누구와 함께
                        </label>
                        <select id="companion" 
                            class="w-full px-3.5 py-3.5 bg-slate-50 border border-slate-300 rounded-2xl text-base text-slate-900 font-medium focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:border-transparent focus:bg-white transition-all">
                            <option value="혼자">혼자 떠나기</option>
                            <option value="친구와" selected>친구와 함께</option>
                            <option value="연인과">연인과 함께</option>
                            <option value="가족과">가족과 함께</option>
                        </select>
                    </div>
                </div>

                <!-- Interests -->
                <div>
                    <label class="block text-sm font-bold text-slate-800 mb-2" for="interests">
                        <i class="fa-solid fa-heart text-indigo-600 mr-1.5"></i>주요 관심사
                    </label>
                    <input type="text" id="interests" placeholder="예: 로컬 맛집, 감성 카페, 쇼핑, 야경 명소" 
                        class="w-full px-4 py-3.5 bg-slate-50 border border-slate-300 rounded-2xl text-base text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:border-transparent focus:bg-white transition-all">
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submit-btn"
                    class="w-full mt-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-base py-4 px-5 rounded-2xl shadow-md shadow-indigo-200/80 transition-all duration-200 flex items-center justify-center space-x-2 active:scale-[0.98]">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span>AI 맞춤 일정 생성하기</span>
                </button>
            </form>
        </section>

        <!-- Loading State (Hidden by default) -->
        <div id="loading-state" class="hidden text-center py-20 bg-white rounded-3xl shadow-sm border border-slate-200/80">
            <div class="inline-block relative w-14 h-14 mb-5">
                <div class="absolute inset-0 rounded-full border-4 border-indigo-100"></div>
                <div class="absolute inset-0 rounded-full border-4 border-indigo-600 border-t-transparent animate-spin"></div>
            </div>
            <h3 class="font-extrabold text-slate-900 text-lg">맞춤 일정을 설계하고 있어요</h3>
            <p class="text-sm text-slate-600 mt-2 px-6 leading-relaxed">동선이 겹치지 않는 실제 맛집과 명소를 조합하는 중입니다...</p>
        </div>

        <!-- Result Section (Hidden by default) -->
        <section id="result-section" class="hidden space-y-5">
            <div class="bg-white rounded-3xl p-5 border border-slate-200/80 shadow-xs flex items-start justify-between gap-3">
                <div>
                    <h2 id="result-title" class="text-xl font-extrabold text-slate-900 leading-snug">여행 일정</h2>
                    <p id="result-subtitle" class="text-sm text-slate-600 mt-1 leading-relaxed">AI 맞춤 추천 코스</p>
                </div>
                <button onclick="resetForm()" class="text-sm text-indigo-700 font-bold bg-indigo-50 hover:bg-indigo-100 px-3.5 py-2.5 rounded-xl transition-colors flex items-center space-x-1.5 shrink-0 border border-indigo-100">
                    <i class="fa-solid fa-rotate-left text-xs"></i>
                    <span>다시 짜기</span>
                </button>
            </div>

            <!-- Day Cards Container -->
            <div id="itinerary-cards" class="space-y-6">
                <!-- Dynamic cards populated here -->
            </div>
        </section>

    </main>

    <!-- Custom Message Box Modal -->
    <div id="modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 text-center shadow-2xl">
            <div id="modal-icon" class="w-12 h-12 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center mx-auto mb-3.5 text-xl">
                <i class="fa-solid fa-circle-info"></i>
            </div>
            <h3 id="modal-title" class="font-extrabold text-slate-900 text-lg mb-1.5">알림</h3>
            <p id="modal-message" class="text-sm text-slate-600 mb-6 leading-relaxed">메시지 내용</p>
            <button onclick="closeModal()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl text-sm transition-colors">
                확인
            </button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="py-8 text-center text-xs text-slate-500">
        &copy; TripAI Planner. 본 일정은 AI가 제안하는 참고용 코스입니다.
    </footer>

            document.getElementById('modal-title').innerText = title;

            const iconEl = document.getElementById('modal-icon');
            if (isError) {
                iconEl.className = 'w-12 h-12 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center mx-auto mb-3 text-lg';
                iconEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
            } else {
                iconEl.className = 'w-12 h-12 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center mx-auto mb-3 text-lg';
                iconEl.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
            }
            document.getElementById('modal').classList.remove('hidden');
        }

            document.getElementById('modal').classList.add('hidden');

        // Update API Status Badge helper
        function setApiBadge(isLive) {
            const dot = document.getElementById('api-status-dot');
            const text = document.getElementById('api-status-text');
            if (isLive) {
                dot.className = 'w-2 h-2 rounded-full bg-emerald-500 animate-pulse';
                text.innerText = 'Gemini 실시간 연동';
            } else {
                dot.className = 'w-2 h-2 rounded-full bg-amber-500';
                text.innerText = '예시 데이터 모드';
            }
        }

        // Handle Form Submission
        async function handleGenerate(event) {
            event.preventDefault();

            const destination = document.getElementById('destination').value.trim();
            const duration = document.getElementById('duration').value;
            const companion = document.getElementById('companion').value;
            const interests = document.getElementById('interests').value.trim();

            if (!destination) {
                showModal('입력 오류', '여행지를 입력해주세요!', true);
                return;
            }

            const formSection = document.getElementById('plan-form').parentElement;
            const loadingState = document.getElementById('loading-state');
            const resultSection = document.getElementById('result-section');

            formSection.classList.add('hidden');
            loadingState.classList.remove('hidden');
            resultSection.classList.add('hidden');

            try {
                // Attempt to call Vercel serverless function endpoint /api/plan
                const response = await fetch('/api/plan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ destination, duration, companion, interests })
                });

                if (!response.ok) {
                    throw new Error(`API 응답 오류 (상태 코드: ${response.status})`);
                }

                const rawData = await response.json();
                setApiBadge(true);
                const normalizedData = normalizeItineraryData(rawData, { destination, duration, companion, interests });
                renderItinerary(normalizedData, destination);
            } catch (error) {
                // Fallback simulation when /api/plan is not yet deployed
                console.warn('API /api/plan 연결 실패. 예시 일정 데이터로 대체합니다.', error);
                setApiBadge(false);
                
                setTimeout(() => {
                    const customMock = JSON.parse(JSON.stringify(mockItineraryData));
                    customMock.title = `${destination} ${duration} 추천 일정 (예시)`;
                    customMock.subtitle = `⚠️ /api/plan 함수 배포 전이므로 예시 일정이 표시됩니다.`;
                    
                    if (duration === '1박 2일') {
                        customMock.days = customMock.days.slice(0, 2);
                    } else if (duration === '3박 4일') {
                        customMock.days.push({
                            "day": 4,
                            "title": "여유로운 마지막 날 브런치 & 귀국",
                            "schedule": [
                                {
                                    "time": "10:00",
                                    "title": "호텔 체크아웃 및 로컬 베이커리 조식",
                                    "placeName": `${destination} 시내 인기 베이커리 카페`,
                                    "desc": "갓 구운 빵과 커피로 여유롭게 여행 마무리",
                                    "tip": "면세 한도와 수하물 무게를 미리 체크하세요."
                                },
                                {
                                    "time": "13:00",
                                    "title": "공항 이동 및 출국 수속",
                                    "placeName": `${destination} 국제공항`,
                                    "desc": "면세점 쇼핑 후 귀국편 탑승",
                                    "tip": "모바일 탑승권을 미리 발급받으면 대기 시간을 줄일 수 있습니다."
                                }
                            ]
                        });
                    }
                    
                    renderItinerary(customMock, destination);
                }, 900);
            }
        }

        // API 응답 데이터 정규화 헬퍼
        function normalizeItineraryData(raw, fallbackInfo) {
            const source = raw.data || raw.plan || raw.itinerary || raw;
            const rawDays = Array.isArray(source.days) ? source.days : (Array.isArray(source) ? source : []);

            return {
                title: source.title || `${fallbackInfo.destination} ${fallbackInfo.duration} 맞춤 여행`,
                subtitle: source.subtitle || `${fallbackInfo.companion}과(와) 함께하는 실존 명소 코스`,
                days: rawDays.map((d, idx) => {
                    const rawSchedule = d.schedule || d.activities || d.items || d.plans || [];
                    return {
                        day: d.day || idx + 1,
                        title: d.title || d.theme || `${idx + 1}일차 추천 코스`,
                        schedule: Array.isArray(rawSchedule) ? rawSchedule.map(item => ({
                            time: item.time || '일정',
                            title: item.title || item.activity || '추천 코스',
                            placeName: item.placeName || item.place || item.location || '',
                            imageUrl: item.imageUrl || item.image || '',
                            desc: item.desc || item.description || item.memo || '',
                            tip: item.tip || ''
                        })) : []
                    };
                })
            };
        }

        // Render Itinerary Cards
        function renderItinerary(data, destinationQuery = '') {
            document.getElementById('loading-state').classList.add('hidden');
            
            document.getElementById('result-title').innerText = data.title || '나만의 맞춤 여행 일정';
            document.getElementById('result-subtitle').innerText = data.subtitle || 'Gemini AI가 추천하는 최적의 코스입니다.';

            const container = document.getElementById('itinerary-cards');
            container.innerHTML = '';

            if (data.days && Array.isArray(data.days) && data.days.length > 0) {
                data.days.forEach(dayObj => {
                    let scheduleHtml = '';
                    if (dayObj.schedule && Array.isArray(dayObj.schedule)) {
                        dayObj.schedule.forEach((item) => {
                            // 구글 지도 검색 링크 생성 (실제 장소명 + 여행지 조합)
                            const searchKeyword = item.placeName ? `${destinationQuery} ${item.placeName}` : `${destinationQuery} ${item.title}`;
                            const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(searchKeyword.trim())}`;

                            // 장소 관련 사진 카드 (이미지가 있으면 노출, 로드 실패 시 깔끔하게 숨김 처리)
                            const imageHtml = item.imageUrl ? `
                                <div class="mt-2 mb-2.5 overflow-hidden rounded-2xl border border-slate-100 bg-slate-100 relative group">
                                    <img src="${item.imageUrl}" alt="${item.placeName || item.title}" 
                                         loading="lazy"
                                         onerror="this.parentElement.style.display='none'"
                                         class="w-full h-40 object-cover transition-transform duration-300 group-hover:scale-105">
                                    <a href="${mapUrl}" target="_blank" rel="noopener noreferrer"
                                       class="absolute bottom-2 right-2 bg-slate-900/75 backdrop-blur-sm text-white text-[11px] font-medium px-2.5 py-1 rounded-lg flex items-center space-x-1 hover:bg-indigo-600 transition-colors">
                                        <i class="fa-solid fa-up-right-from-square text-[10px]"></i>
                                        <span>장소 상세</span>
                                    </a>
                                </div>
                            ` : '';

                            const placeBadgeHtml = item.placeName ? `
                                <div class="mt-1.5 mb-1.5 flex flex-wrap items-center gap-1.5">
                                    <span class="inline-flex items-center text-[11px] font-semibold text-slate-700 bg-slate-100 px-2.5 py-1 rounded-lg">
                                        <i class="fa-solid fa-location-dot text-rose-500 mr-1.5"></i>${item.placeName}
                                    </span>
                                    <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" 
                                       class="inline-flex items-center text-[11px] font-semibold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 px-2.5 py-1 rounded-lg transition-colors">
                                        <i class="fa-solid fa-map-location-dot mr-1"></i>지도 보기
                                    </a>
                                </div>
                            ` : '';

                            const tipHtml = item.tip ? `
                                <div class="mt-2 bg-amber-50/80 border border-amber-100 rounded-xl px-3 py-2 text-[11px] text-amber-800 flex items-start space-x-1.5">
                                    <i class="fa-solid fa-lightbulb text-amber-500 mt-0.5 shrink-0"></i>
                                    <span>${item.tip}</span>
                                </div>
                            ` : '';

                            scheduleHtml += `
                                <div class="relative pl-6 pb-5 last:pb-0 border-l-2 border-indigo-100 last:border-l-transparent">
                                    <div class="absolute -left-[7px] top-0 w-3 h-3 rounded-full bg-indigo-600 ring-4 ring-indigo-50"></div>
                                    <div class="flex items-center space-x-2 mb-0.5">
                                        <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-md shrink-0">${item.time}</span>
                                        <h4 class="text-sm font-bold text-slate-800 leading-snug">${item.title}</h4>
                                    </div>
                                    ${placeBadgeHtml}
                                    ${imageHtml}
                                    <p class="text-xs text-slate-600 leading-relaxed">${item.desc}</p>
                                    ${tipHtml}
                                </div>
                            `;
                        });
                    }

                    const card = document.createElement('div');
                    card.className = 'bg-white rounded-3xl p-6 shadow-sm border border-slate-200/80';
                    card.innerHTML = `
                        <div class="flex items-center justify-between mb-5 pb-4 border-b border-slate-100">
                            <div class="flex items-center space-x-2.5">
                                <span class="bg-indigo-600 text-white text-xs font-extrabold px-3 py-1.5 rounded-xl tracking-wide shrink-0">DAY ${dayObj.day}</span>
                                <h3 class="font-extrabold text-slate-900 text-base sm:text-lg leading-snug">${dayObj.title}</h3>
                            </div>
                        </div>
                        <div class="pt-1">
                            ${scheduleHtml}
                        </div>
                    `;
                    container.appendChild(card);
                });
            } else {
                container.innerHTML = `
                    <div class="bg-white rounded-3xl p-6 text-center border border-slate-100 shadow-sm">
                        <p class="text-sm font-semibold text-slate-700">표시할 세부 일정이 없습니다.</p>
                        <p class="text-xs text-slate-400 mt-1">조건을 변경하여 다시 시도해 주세요.</p>
                    </div>
                `;
            }

            document.getElementById('result-section').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Reset to Form View
        function resetForm() {
            document.getElementById('result-section').classList.add('hidden');
            document.getElementById('plan-form').parentElement.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 여행 플래너</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-slate-50 via-indigo-50/30 to-slate-100 min-h-full font-sans text-slate-800 antialiased flex flex-col">

    <!-- Header -->
    <header class="bg-white/90 backdrop-blur-md sticky top-0 z-30 border-b border-slate-100 shadow-sm">
        <div class="max-w-md mx-auto px-4 py-3.5 flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div class="bg-gradient-to-tr from-indigo-600 to-violet-500 text-white w-9 h-9 rounded-2xl flex items-center justify-center shadow-md shadow-indigo-200">
                    <i class="fa-solid fa-plane-departure text-sm"></i>
                </div>
                <div>
                    <span class="font-bold text-base text-slate-900 tracking-tight block leading-tight">TripAI Planner</span>
                    <span class="text-[10px] text-indigo-600 font-semibold uppercase tracking-wider">Gemini Powered</span>
                </div>
            </div>
            <div class="flex items-center space-x-1.5 text-xs text-slate-600 bg-slate-100/80 px-3 py-1.5 rounded-full font-medium border border-slate-200/60">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>API 대기 모드</span>
            </div>
        </div>
    </header>

    <!-- Main Container (Mobile optimized max-width) -->
    <main class="flex-1 max-w-md w-full mx-auto px-4 py-6 space-y-6">

        <!-- Input Form Card -->
        <section class="bg-white rounded-3xl p-6 shadow-xl shadow-slate-100/80 border border-slate-100 transition-all duration-300">
            <div class="mb-5">
                <h1 class="text-xl font-bold text-slate-900 mb-1">어디로 떠나시나요? ✈️</h1>
                <p class="text-xs text-slate-500 leading-relaxed">원하시는 조건을 입력하시면 Gemini AI가 완벽한 일정을 설계해 드립니다.</p>
            </div>

            <form id="plan-form" class="space-y-4" onsubmit="handleGenerate(event)">
                <!-- Destination -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5" for="destination">
                        <i class="fa-solid fa-location-dot text-indigo-500 mr-1"></i> 여행지
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                            <i class="fa-solid fa-search text-xs"></i>
                        </span>
                        <input type="text" id="destination" required placeholder="예: 일본 도쿄, 제주도, 파리" 
                            class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
                    </div>
                </div>

                <!-- Duration & Companions (Grid) -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5" for="duration">
                            <i class="fa-solid fa-calendar-days text-indigo-500 mr-1"></i> 기간
                        </label>
                        <select id="duration" 
                            class="w-full px-3 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
                            <option value="1박 2일">1박 2일</option>
                            <option value="2박 3일" selected>2박 3일</option>
                            <option value="3박 4일">3박 4일</option>
                            <option value="4박 5일">4박 5일</option>
                            <option value="일주일">일주일 이상</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5" for="companion">
                            <i class="fa-solid fa-user-group text-indigo-500 mr-1"></i> 동행자
                        </label>
                        <select id="companion" 
                            class="w-full px-3 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
                            <option value="혼자">혼자 떠나기</option>
                            <option value="친구와" selected>친구와 함께</option>
                            <option value="연인과">연인과 함께</option>
                            <option value="가족과">가족과 함께</option>
                        </select>
                    </div>
                </div>

                <!-- Interests -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5" for="interests">
                        <i class="fa-solid fa-heart text-indigo-500 mr-1"></i> 주요 관심사
                    </label>
                    <input type="text" id="interests" placeholder="예: 맛집탐방, 감성카페, 쇼핑, 문화유적" 
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submit-btn"
                    class="w-full mt-3 bg-gradient-to-r from-indigo-600 via-indigo-500 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white font-semibold py-3.5 px-4 rounded-2xl shadow-lg shadow-indigo-200 transition-all duration-200 flex items-center justify-center space-x-2 active:scale-[0.98]">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span>AI 맞춤 일정 생성하기</span>
                </button>
            </form>
        </section>

        <!-- Loading State (Hidden by default) -->
        <div id="loading-state" class="hidden text-center py-16 bg-white rounded-3xl shadow-xl shadow-slate-100 border border-slate-100">
            <div class="inline-block relative w-14 h-14 mb-4">
                <div class="absolute inset-0 rounded-full border-4 border-indigo-100"></div>
                <div class="absolute inset-0 rounded-full border-4 border-indigo-600 border-t-transparent animate-spin"></div>
            </div>
            <h3 class="font-bold text-slate-800 text-base">Gemini가 일정을 계획 중입니다</h3>
            <p class="text-xs text-slate-400 mt-1.5 px-6">최적의 맛집과 동선을 조합하여 멋진 여행 코스를 만드는 중이에요...</p>
        </div>

        <!-- Result Section (Hidden by default) -->
        <section id="result-section" class="hidden space-y-4">
            <div class="flex items-center justify-between px-1">
                <div>
                    <h2 id="result-title" class="text-base font-bold text-slate-900 leading-tight">여행 일정</h2>
                    <p id="result-subtitle" class="text-xs text-slate-500 mt-0.5">AI 맞춤 추천 코스</p>
                </div>
                <button onclick="resetForm()" class="text-xs text-indigo-600 font-semibold bg-indigo-50 hover:bg-indigo-100 px-3 py-2 rounded-xl transition-colors flex items-center space-x-1 shrink-0">
                    <i class="fa-solid fa-rotate-left"></i>
                    <span>다시 만들기</span>
                </button>
            </div>

            <!-- Day Cards Container -->
            <div id="itinerary-cards" class="space-y-4">
                <!-- Dynamic cards populated here -->
            </div>
        </section>

    </main>

    <!-- Custom Message Box Modal -->
    <div id="modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-xs w-full p-6 text-center shadow-2xl animate-in fade-in zoom-in duration-200">
            <div id="modal-icon" class="w-12 h-12 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center mx-auto mb-3 text-lg">
                <i class="fa-solid fa-circle-info"></i>
            </div>
            <h3 id="modal-title" class="font-bold text-slate-900 text-base mb-1">알림</h3>
            <p id="modal-message" class="text-xs text-slate-500 mb-5 leading-relaxed">메시지 내용</p>
            <button onclick="closeModal()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl text-sm transition-colors shadow-md shadow-indigo-100">
                확인
            </button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="py-6 text-center text-[11px] text-slate-400">
        &copy; TripAI Planner. Designed for Mobile & Web.
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // Modal Helper (Replacing alert)
        function showModal(title, message, isError = false) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            const iconEl = document.getElementById('modal-icon');
            if (isError) {
                iconEl.className = 'w-12 h-12 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center mx-auto mb-3 text-lg';
                iconEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
            } else {
                iconEl.className = 'w-12 h-12 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center mx-auto mb-3 text-lg';
                iconEl.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
            }
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        // Mock Itinerary Data for Fallback/Preview
        const mockItineraryData = {
            "title": "도쿄 감성 맛집 & 쇼핑 투어",
            "subtitle": "친구와 함께하는 알차고 여유로운 코스",
            "days": [
                {
                    "day": 1,
                    "title": "도쿄 도착 및 신주쿠·시부야 탐방",
                    "schedule": [
                        { "time": "10:00", "title": "공항 도착 및 호텔 체크인", "desc": "시내 중심가 숙소로 이동 후 짐 맡기기" },
                        { "time": "12:30", "title": "현지 유명 맛집에서 점심 식사", "desc": "신선한 재료로 만든 대표 로컬 메뉴 맛보기" },
                        { "time": "15:00", "title": "랜드마크 전망대 방문", "desc": "도시 전경을 한눈에 담을 수 있는 탁 트인 뷰 감상" },
                        { "time": "18:30", "title": "로컬 감성 이자카야 거리 산책", "desc": "아늑한 분위기 속에서 즐기는 저녁 만찬과 맥주" }
                    ]
                },
                {
                    "day": 2,
                    "title": "트렌디한 카페와 핫플레이스 투어",
                    "schedule": [
                        { "time": "09:30", "title": "인기 브런치 카페에서 아침 식사", "desc": "향긋한 커피와 함께 여유로운 하루 시작" },
                        { "time": "11:30", "title": "개성 넘치는 편집숍 및 쇼핑 거리", "desc": "트렌디한 브랜드와 빈티지 숍 구경" },
                        { "time": "14:00", "title": "도심 속 공원 산책 및 휴식", "desc": "자연을 느끼며 잠시 쉬어가는 힐링 타임" },
                        { "time": "19:00", "title": "분위기 좋은 레스토랑 디너", "desc": "여행의 둘째 날을 기념하는 특별한 저녁 식사" }
                    ]
                },
                {
                    "day": 3,
                    "title": "여유로운 마무리 및 기념품 쇼핑",
                    "schedule": [
                        { "time": "10:00", "title": "역사 문화 유적지 탐방", "desc": "지역 전통을 느낄 수 있는 명소 구경" },
                        { "time": "12:30", "title": "현지인 추천 마지막 맛집", "desc": "여운이 남는 깔끔한 정식으로 점심" },
                        { "time": "14:30", "title": "공항 이동 및 면세점 쇼핑", "desc": "여행 마무리 및 출국 수속" }
                    ]
                }
            ]
        };

        // Handle Form Submission
        async function handleGenerate(event) {
            event.preventDefault();

            const destination = document.getElementById('destination').value.trim();
            const duration = document.getElementById('duration').value;
            const companion = document.getElementById('companion').value;
            const interests = document.getElementById('interests').value.trim();

            if (!destination) {
                showModal('입력 오류', '여행지를 입력해주세요!', true);
                return;
            }

            const formSection = document.getElementById('plan-form').parentElement;
            const loadingState = document.getElementById('loading-state');
            const resultSection = document.getElementById('result-section');

            formSection.classList.add('hidden');
            loadingState.classList.remove('hidden');
            resultSection.classList.add('hidden');

            try {
                // Attempt to call Vercel serverless function endpoint /api/plan
                const response = await fetch('/api/plan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ destination, duration, companion, interests })
                });

                if (!response.ok) {
                    throw new Error(`API 응답 오류 (상태 코드: ${response.status})`);
                }

                const rawData = await response.json();
                // 응답 데이터가 중첩되어 있거나 일부 키 이름이 다를 경우를 대비해 정규화
                const normalizedData = normalizeItineraryData(rawData, { destination, duration, companion, interests });
                renderItinerary(normalizedData);
            } catch (error) {
                // Fallback simulation when /api/plan is not yet deployed
                console.warn('API /api/plan 연결 실패. 예시 일정 데이터로 대체합니다.', error);
                
                setTimeout(() => {
                    const customMock = JSON.parse(JSON.stringify(mockItineraryData));
                    customMock.title = `${destination} ${duration} 여행 일정`;
                    customMock.subtitle = `${companion}과(와) 함께하는 ${interests ? interests + ' 중심' : '알차고 즐거운'} 코스`;
                    
                    // Adjust day count display based on duration selection
                    if (duration === '1박 2일') {
                        customMock.days = customMock.days.slice(0, 2);
                    } else if (duration === '3박 4일') {
                        customMock.days.push({
                            "day": 4,
                            "title": "여유로운 마지막 날 일정",
                            "schedule": [
                                { "time": "10:00", "title": "호텔 체크아웃 및 조식", "desc": "여유롭게 아침 식사 후 짐 정리" },
                                { "time": "13:00", "title": "공항으로 이동", "desc": "아쉬움을 뒤로 하고 공항으로 출발" }
                            ]
                        });
                    }
                    
                    renderItinerary(customMock);
                }, 1200);
            }
        }

        // API 응답 데이터 정규화 헬퍼 (필드명 불일치 및 누락 방어)
        function normalizeItineraryData(raw, fallbackInfo) {
            const source = raw.data || raw.plan || raw.itinerary || raw;
            const rawDays = Array.isArray(source.days) ? source.days : (Array.isArray(source) ? source : []);

            return {
                title: source.title || `${fallbackInfo.destination} ${fallbackInfo.duration} 여행 일정`,
                subtitle: source.subtitle || `${fallbackInfo.companion}과(와) 함께하는 맞춤 코스`,
                days: rawDays.map((d, idx) => {
                    const rawSchedule = d.schedule || d.activities || d.items || d.plans || [];
                    return {
                        day: d.day || idx + 1,
                        title: d.title || d.theme || `${idx + 1}일차 추천 코스`,
                        schedule: Array.isArray(rawSchedule) ? rawSchedule.map(item => ({
                            time: item.time || '일정',
                            title: item.title || item.place || item.activity || '추천 장소',
                            desc: item.desc || item.description || item.memo || ''
                        })) : []
                    };
                })
            };
        }

        // Render Itinerary Cards
        function renderItinerary(data) {
            document.getElementById('loading-state').classList.add('hidden');
            
            document.getElementById('result-title').innerText = data.title || '나만의 맞춤 여행 일정';
            document.getElementById('result-subtitle').innerText = data.subtitle || 'Gemini AI가 추천하는 최적의 코스입니다.';

            const container = document.getElementById('itinerary-cards');
            container.innerHTML = '';

            if (data.days && Array.isArray(data.days) && data.days.length > 0) {
                data.days.forEach(dayObj => {
                    let scheduleHtml = '';
                    if (dayObj.schedule && Array.isArray(dayObj.schedule)) {
                        dayObj.schedule.forEach((item) => {
                            scheduleHtml += `
                                <div class="relative pl-6 pb-4 last:pb-0 border-l-2 border-indigo-100 last:border-l-transparent">
                                    <div class="absolute -left-[7px] top-0 w-3 h-3 rounded-full bg-indigo-600 ring-4 ring-indigo-50"></div>
                                    <div class="flex items-center space-x-2 mb-0.5">
                                        <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-md">${item.time}</span>
                                        <h4 class="text-sm font-semibold text-slate-800">${item.title}</h4>
                                    </div>
                                    <p class="text-xs text-slate-500 leading-relaxed">${item.desc}</p>
                                </div>
                            `;
                        });
                    }

                    const card = document.createElement('div');
                    card.className = 'bg-white rounded-3xl p-5 shadow-lg shadow-slate-100/80 border border-slate-100';
                    card.innerHTML = `
                        <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
                            <div class="flex items-center space-x-2">
                                <span class="bg-indigo-600 text-white text-xs font-bold px-2.5 py-1 rounded-xl shadow-sm">DAY ${dayObj.day}</span>
                                <h3 class="font-bold text-slate-900 text-sm">${dayObj.title}</h3>
                            </div>
                        </div>
                        <div class="space-y-3 pt-1">
                            ${scheduleHtml}
                        </div>
                    `;
                    container.appendChild(card);
                });
            } else {
                container.innerHTML = `
                    <div class="bg-white rounded-3xl p-6 text-center border border-slate-100 shadow-sm">
                        <p class="text-sm font-semibold text-slate-700">표시할 세부 일정이 없습니다.</p>
                        <p class="text-xs text-slate-400 mt-1">조건을 변경하여 다시 시도해 주세요.</p>
                    </div>
                `;
            }

            document.getElementById('result-section').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Reset to Form View
        function resetForm() {
            document.getElementById('result-section').classList.add('hidden');
            document.getElementById('plan-form').parentElement.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
